[project]
name = "spotify-client"
version = "0.1.0"
description = "This library provides an interface to interact with the Spotify Web API (through the `spotipy` package) and manage configuration data needed for the downstream services."
readme = "README.md"
authors = [{ name = "Lukas Ellemunt", email = "lukas.ellemunt@icloud.com" }]
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"
